name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lake build + axiom audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Lean and build
        uses: leanprover/lean-action@v1
        with:
          build: true
          use-github-cache: true

      - name: Axiom-footprint gate
        run: lake env lean tools/AxiomAudit.lean
